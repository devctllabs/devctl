name: Main CI

on:
  push:
    branches: [main]

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos-build:
    name: ${{ format('build (macOS/{0})', matrix.goarch) }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            examples/orders-api/go.sum
      - name: Build macOS binary
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          GOWORK=off go build \
            -trimpath \
            -o "${RUNNER_TEMP}/devctl-darwin-${GOARCH}" \
            ./cmd/devctl
