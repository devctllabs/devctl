openapi: 3.1.0
info:
  title: Orders API
  version: 1.0.0
paths:
  /orders:
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrder"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/{id}:
    get:
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    CreateOrder:
      type: object
      additionalProperties: false
      required:
        - customer_name
        - total_cents
      properties:
        customer_name:
          type: string
          minLength: 1
        total_cents:
          type: integer
          format: int64
          minimum: 0
    Order:
      type: object
      additionalProperties: false
      required:
        - id
        - customer_name
        - total_cents
        - created_at
      properties:
        id:
          type: integer
          format: int64
        customer_name:
          type: string
        total_cents:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    Problem:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
