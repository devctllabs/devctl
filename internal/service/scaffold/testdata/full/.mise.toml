[tools]
go = "1.26.0"
golangci-lint = "2.12.2"
node = "24"
"npm:quicktype" = "26.0.0"

[tasks.fmt]
run = "golangci-lint fmt"
[tasks."fmt:check"]
run = "golangci-lint fmt --diff"
[tasks."lint:contracts"]
run = "devctl lint"
[tasks."lint:go"]
run = "golangci-lint run"
[tasks.lint]
depends = ["lint:contracts", "lint:go"]
[tasks.test]
run = "go test ./..."
[tasks.gen]
run = "devctl gen"
[tasks."gen:http"]
run = "devctl gen http"
[tasks."gen:grpc"]
run = "devctl gen grpc"
[tasks."gen:kafka"]
run = "devctl gen kafka"
[tasks.check]
depends = ["fmt:check", "lint", "test"]

[tasks."migrate:analytics:clickhouse:create"]
description = "Create timestamped migration files in migrations/analytics/clickhouse"
usage = 'arg "<name>" help="Migration name"'
run = '''
devctl migrate create --target "analytics:clickhouse" "${usage_name?}"
'''

[tasks."migrate:analytics:clickhouse:up"]
description = "Apply migrations from migrations/analytics/clickhouse"
usage = '''
flag "--steps <N>" help="Apply N migrations; omit to apply all"
flag "--env-file <path>" help="Read migration URL from dotenv file"
'''
run = '''
set --
if [ -n "${usage_steps:-}" ]; then set -- --steps "$usage_steps"; fi
if [ -n "${usage_env_file:-}" ]; then set -- "$@" --env-file "$usage_env_file"; fi
devctl migrate up --target "analytics:clickhouse" "$@"
'''

[tasks."migrate:analytics:clickhouse:down"]
description = "Roll back migrations from migrations/analytics/clickhouse"
usage = '''
arg "[steps]" default="1" help="Number of migrations"
flag "--env-file <path>" help="Read migration URL from dotenv file"
'''
run = '''
set --
if [ -n "${usage_env_file:-}" ]; then set -- --env-file "$usage_env_file"; fi
devctl migrate down --target "analytics:clickhouse" --steps "${usage_steps?}" "$@"
'''

[tasks."migrate:analytics:clickhouse:status"]
description = "Show migration version and dirty state for analytics:clickhouse"
usage = 'flag "--env-file <path>" help="Read migration URL from dotenv file"'
run = '''
set --
if [ -n "${usage_env_file:-}" ]; then set -- --env-file "$usage_env_file"; fi
devctl migrate status --target "analytics:clickhouse" "$@"
'''
